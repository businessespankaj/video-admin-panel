<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Success</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f0f0f;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
      box-sizing:border-box;
    }
    .card{
      width:100%;
      max-width:520px;
      background:#1b1b1b;
      border:1px solid #2f2f2f;
      border-radius:18px;
      padding:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      text-align:center;
    }
    h2{
      margin:0 0 12px;
      font-size:28px;
    }
    p{
      margin:10px 0;
      color:#d8d8d8;
      line-height:1.5;
    }
    .status{
      margin-top:18px;
      padding:14px;
      border-radius:12px;
      background:#111;
      border:1px solid #333;
      word-break:break-word;
    }
    a{
      color:#7cc7ff;
      word-break:break-word;
    }
    .small{
      font-size:13px;
      color:#a8a8a8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Payment Successful! 🎉</h2>
    <p>Your premium content is ready.</p>
    <div id="result" class="status">Please wait...</div>
    <p class="small">If link does not load, refresh once after 5 seconds.</p>
  </div>

  <script>
(async function () {
  const params = new URLSearchParams(window.location.search);

  // URL se lo, agar na mile to localStorage se lo
  const orderId =
    params.get("order_id") || localStorage.getItem("pendingOrderId");

  const videoId =
    params.get("video_id") || localStorage.getItem("pendingVideoId");

  const result = document.getElementById("result");

  if (!orderId) {
    result.innerHTML = "Order ID not found.";
    return;
  }

  if (!videoId) {
    result.innerHTML = "Video ID not found.";
    return;
  }

  try {
    const response = await fetch(
      "https://cashfree-backend-l0ev.onrender.com/verify-payment?order_id=" +
      encodeURIComponent(orderId) +
      "&video_id=" +
      encodeURIComponent(videoId)
    );

    const data = await response.json();

    if (data.success && data.fileLink) {
      result.innerHTML = `
        <div><strong>Premium link:</strong></div>
        <div style="margin-top:10px;">
          <a href="${data.fileLink}" target="_blank" rel="noopener noreferrer">
            ${data.fileLink}
          </a>
        </div>
      `;

      // Payment data clear kar do
      localStorage.removeItem("pendingOrderId");
      localStorage.removeItem("pendingVideoId");
      return;
    }

    result.innerHTML = "Payment verified, but premium link not found.";
  } catch (error) {
    result.innerHTML = "Error: " + error.message;
  }
})();
  </script>
</body>
</html>
