<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Payment Successful</title>
</head>
<body>
  <h2>Payment Successful! 🎉</h2>
  <p>Redirecting to your premium content...</p>

  <script>
    async function loadPremiumLink() {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("order_id");

      if (!orderId) {
        document.body.innerHTML = "<h2>Order ID not found.</h2>";
        return;
      }

      try {
        const res = await fetch(
          "https://cashfree-backend-l0ev.onrender.com/verify-payment?order_id=" +
          encodeURIComponent(orderId)
        );

        const data = await res.json();

        if (data.success && data.fileLink) {
          // Premium link automatically open hoga
          window.location.href = data.fileLink;
        } else {
          document.body.innerHTML =
            "<h2>Payment verified, but premium link not found.</h2>";
        }
      } catch (error) {
        document.body.innerHTML =
          "<h2>Error: " + error.message + "</h2>";
      }
    }

    loadPremiumLink();
  </script>
</body>
</html>
